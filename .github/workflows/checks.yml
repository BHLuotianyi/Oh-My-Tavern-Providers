name: Checks

# Runs the full suite on every push to `main` and on pull requests. Build
# identities are written by the nightly and release channels only, so this
# workflow never touches the version files and never commits: `main` history
# stays human-authored.
on:
  push:
    branches: [main]
  # Run the same gates before a PR can merge, not only after it lands on main.
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: npm test
      - name: Catalog validation
        run: npm run validate
