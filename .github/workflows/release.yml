name: Release

# Manual release: push a tag such as `v1.1.0`. The workflow re-runs the checks,
# verifies that the tag matches the version files, then publishes a GitHub
# Release with a source archive. Nothing is published if a check fails.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Unit tests
        run: npm test
      - name: Catalog validation
        run: npm run validate

      - name: Verify the tag matches the version files
        run: node tools/version.mjs check-tag "$GITHUB_REF_NAME"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          git archive --format=tar --prefix=omtp-model-hub/ HEAD | tar -xf - -C "$stage"
          node -e '
            const fs = require("node:fs");
            for (const file of process.argv.slice(1)) {
              fs.writeFileSync(file, JSON.stringify(JSON.parse(fs.readFileSync(file, "utf8"))));
            }
          ' "$stage/omtp-model-hub/catalog/omtp-catalog.json" \
            "$stage/omtp-model-hub/server-plugin/catalog/omtp-catalog.json"
          out="$PWD/dist/omtp-$GITHUB_REF_NAME.zip"
          (cd "$stage" && zip -9 -rq "$out" omtp-model-hub)
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/omtp-$GITHUB_REF_NAME.zip#OMTP $GITHUB_REF_NAME (client extension + server plugin)" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
